name: Community checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: npm rebuild node-pty --build-from-source
      - run: bun run check
      - run: bun run test:unit
      - run: bun run release:comments
      - run: bun audit
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - run: bun tests/rendering-security.e2e.mjs
      - run: bun tests/product-projects.e2e.mjs
      - run: bun tests/questionnaire.e2e.mjs
      - run: bun tests/workspace-preparation.e2e.mjs
      - run: bun tests/composer-focus-paste.e2e.mjs
      - run: docker compose config --quiet
