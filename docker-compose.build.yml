services:
  panda-force:
    image: ${PANDA_FORCE_IMAGE:-panda-force:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_BASE: ${PANDA_FORCE_BUILD_BASE:-hiforceai/panda-force-build-base@sha256:963bf3d085b78419caec7f5a2a53323c012956e334c716e3754cd744bfb4b1e3}
        RUNTIME_BASE: ${PANDA_FORCE_RUNTIME_BASE:-hiforceai/panda-force-runtime-base@sha256:ce564a38e60c4119cd4addd7f9cda11fd3accefa72a4fb7ad6978800a37a86ba}
        VERIFICATION_PROFILE: ${PANDA_FORCE_VERIFICATION_PROFILE:-none}
        INSTALL_VIDEO_TOOLS: ${PANDA_FORCE_INSTALL_VIDEO_TOOLS:-1}
