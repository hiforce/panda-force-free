services:
  panda-force:
    image: ${PANDA_FORCE_IMAGE:-panda-force:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_BASE: ${PANDA_FORCE_BUILD_BASE:-hiforceai/panda-force-build-base@sha256:50226fbc3e63b5477e4b56326d67eee962845ad464d0aee4aa09ee5eff185668}
        RUNTIME_BASE: ${PANDA_FORCE_RUNTIME_BASE:-hiforceai/panda-force-runtime-base@sha256:a8a889237d44c1bbea1f94b581d5075138b038ac07808eb666b8ccb28315d13e}
        VERIFICATION_PROFILE: ${PANDA_FORCE_VERIFICATION_PROFILE:-none}
        INSTALL_VIDEO_TOOLS: ${PANDA_FORCE_INSTALL_VIDEO_TOOLS:-1}
