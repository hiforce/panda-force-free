services:
  panda-force:
    image: ${PANDA_FORCE_IMAGE:-panda-force:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_BASE: ${PANDA_FORCE_BUILD_BASE:-hiforceai/panda-force-build-base@sha256:fdfc05069b26233b28c68a73ba1ea2a7a07dd29b7f9f20b8700d1db144f282b6}
        RUNTIME_BASE: ${PANDA_FORCE_RUNTIME_BASE:-hiforceai/panda-force-runtime-base@sha256:c8e0c1a4dc8dc3d10c81e5cfed5113a4e6b2c49bbb4a1b15a969c6355da15bfc}
        VERIFICATION_PROFILE: ${PANDA_FORCE_VERIFICATION_PROFILE:-none}
        INSTALL_VIDEO_TOOLS: ${PANDA_FORCE_INSTALL_VIDEO_TOOLS:-1}
