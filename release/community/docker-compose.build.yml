services:
  panda-force:
    image: ${PANDA_FORCE_IMAGE:-panda-force:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_BASE: ${PANDA_FORCE_BUILD_BASE:-hiforceai/panda-force-build-base@sha256:66696cf2668c2b2e017d9f106533bdd016ac2a5d5a4c0f593ee59e8f36b75e5e}
        RUNTIME_BASE: ${PANDA_FORCE_RUNTIME_BASE:-hiforceai/panda-force-runtime-base@sha256:d55e7cb61e32fe11750903d32a3d16bd0433be6881e84254772f30312cd4b9c5}
        VERIFICATION_PROFILE: ${PANDA_FORCE_VERIFICATION_PROFILE:-none}
