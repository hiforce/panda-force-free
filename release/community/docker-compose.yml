services:
  panda-force:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PANDA_FORCE_IMAGE:-panda-force:local}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["bun", "run", "start"]
    ports:
      - "${WEBUI_BIND_IP:-127.0.0.1}:${WEBUI_PORT:-8899}:8899"
    environment:
      HOST: "0.0.0.0"
      PORT: "8899"
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      PANDA_FORCE_HOME: /var/lib/panda-force
      SHELL: /bin/bash
      PANDA_FORCE_CWD: /home/codex/workspace
      PANDA_FORCE_REVIEW_ROOT: /home/codex/workspace
      PANDA_FORCE_APP_SERVER_MODE: isolated
      PANDA_FORCE_AUTH_MODE: password
      PANDA_FORCE_PASSWORD: "${PANDA_FORCE_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
      NODE_ENV: production
    volumes:
      - ${PANDA_FORCE_HOME_HOST:-panda-force-state}:/var/lib/panda-force
      - ${CODEX_HOME_HOST:-panda-force-model-state}:/home/codex/.codex
      - ${CODEX_WORKSPACE_HOST:-panda-force-workspace}:/home/codex/workspace
volumes:
  panda-force-state:
    name: ${PANDA_FORCE_STATE_VOLUME_NAME:-}
  panda-force-model-state:
    name: ${PANDA_FORCE_MODEL_VOLUME_NAME:-}
  panda-force-workspace:
    name: ${PANDA_FORCE_WORKSPACE_VOLUME_NAME:-}
