services:
  panda-force:
    image: ${PANDA_FORCE_IMAGE:-hiforceai/panda-force:0.0.4}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["bun", "run", "start"]
    ports:
      - "${PANDA_FORCE_BIND_IP:-${WEBUI_BIND_IP:-127.0.0.1}}:${PANDA_FORCE_PORT:-${WEBUI_PORT:-8899}}:8899"
    environment:
      HOST: "0.0.0.0"
      PORT: "8899"
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      PANDA_FORCE_HOME: /var/lib/panda-force
      SHELL: /bin/bash
      PANDA_FORCE_CWD: /home/codex/workspace
      PANDA_FORCE_REVIEW_ROOT: /home/codex/workspace
      PANDA_FORCE_APP_SERVER_MODE: isolated
      PANDA_FORCE_AUTH_MODE: password
      PANDA_FORCE_PASSWORD: "${PANDA_FORCE_PASSWORD:-}"
      TZ: "${TZ:-UTC}"
      NODE_ENV: production
    volumes:
      - ${PANDA_FORCE_HOME_HOST:-panda-force-state}:/var/lib/panda-force
      - ${PANDA_FORCE_MODEL_HOME_HOST:-${CODEX_HOME_HOST:-panda-force-model-state}}:/home/codex/.codex
      - ${PANDA_FORCE_WORKSPACE_HOST:-${CODEX_WORKSPACE_HOST:-panda-force-workspace}}:/home/codex/workspace
volumes:
  panda-force-state:
    name: ${PANDA_FORCE_STATE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-panda-force}_panda-force-state}
  panda-force-model-state:
    name: ${PANDA_FORCE_MODEL_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-panda-force}_panda-force-model-state}
  panda-force-workspace:
    name: ${PANDA_FORCE_WORKSPACE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-panda-force}_panda-force-workspace}
